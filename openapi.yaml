openapi: 3.1.0
info:
  title: Market Data API
  version: 1.2.0
  description: Consulta cotações diárias não ajustadas publicadas pelo B3 Data Hub.
servers:
  - url: /
paths:
  /comparisons:
    get:
      operationId: compareQuotesGet
      summary: Compara o desempenho de dois a dez ativos
      description: >-
        Consulta somente leitura, com período inclusivo de até cinco anos e timeout de cinco segundos.
        Tickers são normalizados e duplicidades são rejeitadas. Parâmetros desconhecidos ou
        repetidos são rejeitados. Preços não são ajustados por eventos corporativos.
        Pelo menos dois ativos devem ter dois fechamentos positivos em datas distintas.
        Volatilidade amostral anualizada exige três cotações; correlação exige dois intervalos
        de retorno coincidentes e variância positiva. Métricas indisponíveis são omitidas.
      parameters:
        - name: tickers
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            minItems: 2
            maxItems: 10
            uniqueItems: true
            items: { type: string, example: PETR4 }
          example: [PETR4, VALE3]
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/MarketType'
        - name: metrics
          in: query
          style: form
          explode: false
          schema: { $ref: '#/components/schemas/ComparisonMetrics' }
        - name: benchmark
          in: query
          description: Ticker da mesma fonte; resumo separado, sem participar automaticamente dos rankings. Sem dados, retorna insufficient_data.
          schema: { type: string, example: BOVA11 }
        - name: includeSeries
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200': { $ref: '#/components/responses/ComparisonSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/InsufficientComparisonData' }
        '500': { $ref: '#/components/responses/InternalError' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
    post:
      operationId: compareQuotesPost
      summary: Compara ativos a partir de um corpo JSON
      description: >-
        Consulta somente leitura com as mesmas regras e resposta do GET /comparisons.
        Não persiste a comparação. Aceita um único objeto JSON, sem campos desconhecidos,
        com tamanho máximo de 64 KiB. Timeout de cinco segundos.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComparisonRequest' }
            example:
              tickers: [PETR4, VALE3]
              from: '2025-01-01'
              to: '2025-12-31'
              metrics: [return, volatility, drawdown]
              includeSeries: false
      responses:
        '200': { $ref: '#/components/responses/ComparisonSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413':
          description: Corpo excede 64 KiB (request_too_large)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: Content-Type deve ser application/json (unsupported_media_type)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/InsufficientComparisonData' }
        '500': { $ref: '#/components/responses/InternalError' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /quotes/{ticker}:
    get:
      operationId: getLatestQuote
      summary: Retorna a cotação mais recente publicada
      parameters:
        - $ref: '#/components/parameters/Ticker'
        - $ref: '#/components/parameters/MarketType'
      responses:
        '200':
          description: Cotação encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /quotes/{ticker}/history:
    get:
      operationId: getQuoteHistory
      summary: Retorna cotações publicadas em um período
      description: Datas usam YYYY-MM-DD, com período máximo de cinco anos. O resultado contém apenas pregões e os preços são não ajustados.
      parameters:
        - $ref: '#/components/parameters/Ticker'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/MarketType'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        '200':
          description: Página de cotações; data será vazio quando não houver pregões no período.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteHistoryEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
components:
  parameters:
    Ticker:
      name: ticker
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9]{4,12}$', example: PETR4 }
    From:
      name: from
      in: query
      required: true
      schema: { type: string, format: date, example: '2026-08-01' }
    To:
      name: to
      in: query
      required: true
      schema: { type: string, format: date, example: '2026-09-03' }
    MarketType:
      name: marketType
      in: query
      description: Código do tipo de mercado B3; 10 representa mercado à vista.
      schema: { type: integer, minimum: 1, default: 10 }
  schemas:
    ComparisonMetrics:
      type: array
      description: Omissão ou lista JSON vazia aplica as métricas padrão; duplicidades são removidas.
      default: [return, volatility, drawdown, averageVolume, highLow, bestWorstDay]
      items:
        type: string
        enum: [return, volatility, drawdown, averageVolume, highLow, bestWorstDay, correlation]
    ComparisonRequest:
      type: object
      additionalProperties: false
      required: [tickers, from, to]
      properties:
        tickers:
          type: array
          minItems: 2
          maxItems: 10
          uniqueItems: true
          description: Entre 2 e 10 tickers únicos após normalização de espaços e letras maiúsculas.
          items: { type: string, example: PETR4 }
        from: { type: string, format: date }
        to: { type: string, format: date }
        marketType: { type: integer, minimum: 1, default: 10 }
        metrics: { $ref: '#/components/schemas/ComparisonMetrics' }
        benchmark:
          type: string
          description: Ticker consultado na mesma fonte. Não resolve identificadores de índices externos nem calcula excesso de retorno.
        includeSeries: { type: boolean, default: false }
    ComparisonEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [assets, ranking]
          properties:
            assets:
              type: array
              description: Preserva a ordem solicitada, incluindo ativos com dados insuficientes.
              items: { $ref: '#/components/schemas/AssetComparison' }
            ranking:
              type: object
              description: Ignora métricas indisponíveis; empates favorecem o primeiro ticker solicitado.
              properties:
                highestReturn: { type: string }
                lowestVolatility: { type: string }
                lowestDrawdown: { type: string, description: Ativo com drawdown mais próximo de zero. }
            correlations:
              type: array
              description: Pearson sem arredondamento adicional; pares indefinidos são omitidos.
              items:
                type: object
                required: [tickerA, tickerB, value]
                properties:
                  tickerA: { type: string }
                  tickerB: { type: string }
                  value: { type: number, minimum: -1, maximum: 1 }
            benchmark: { $ref: '#/components/schemas/AssetComparison' }
        meta:
          type: object
          required: [requestedTickers, from, to, marketType, metrics, priceAdjustment, currency, source, calculationVersion]
          properties:
            requestedTickers: { type: array, items: { type: string } }
            from: { type: string, format: date }
            to: { type: string, format: date }
            marketType: { type: integer }
            metrics: { $ref: '#/components/schemas/ComparisonMetrics' }
            priceAdjustment: { type: string, const: unadjusted }
            currency: { type: string, const: BRL }
            source: { type: string, const: B3 COTAHIST }
            calculationVersion: { type: string, const: '1.0' }
    AssetComparison:
      type: object
      required: [ticker, status, availableFrom, availableTo]
      description: Métricas não solicitadas ou indisponíveis são omitidas. Percentuais são arredondados a duas casas na apresentação.
      properties:
        ticker: { type: string }
        status: { type: string, enum: [available, insufficient_data] }
        availableFrom: { type: [string, 'null'], format: date }
        availableTo: { type: [string, 'null'], format: date }
        initialPrice: { $ref: '#/components/schemas/Money' }
        finalPrice: { $ref: '#/components/schemas/Money' }
        absoluteReturn: { $ref: '#/components/schemas/Money' }
        percentageReturn: { type: number }
        annualizedVolatility: { type: number, description: Desvio padrão amostral dos retornos multiplicado por sqrt(252) e 100. }
        maximumDrawdown: { type: number, maximum: 0 }
        averageDailyVolume: { $ref: '#/components/schemas/Money' }
        lowestPrice: { $ref: '#/components/schemas/Money' }
        highestPrice: { $ref: '#/components/schemas/Money' }
        bestDay: { $ref: '#/components/schemas/ComparisonDay' }
        worstDay: { $ref: '#/components/schemas/ComparisonDay' }
        message: { type: string }
        series:
          type: array
          description: Incluída apenas quando solicitada e o ativo possui dados suficientes.
          items:
            type: object
            required: [date, closePrice, normalizedPerformance]
            properties:
              date: { type: string, format: date }
              closePrice: { $ref: '#/components/schemas/Money' }
              normalizedPerformance: { type: number, description: Série com referência inicial igual a 100. }
    ComparisonDay:
      type: object
      required: [date, return]
      properties:
        date: { type: string, format: date }
        return: { type: number, description: Retorno percentual do pregão. }
    Quote:
      type: object
      required: [ticker, tradingDate, currency, marketType, openPrice, highPrice, lowPrice, closePrice]
      properties:
        ticker: { type: string, example: PETR4 }
        tradingDate: { type: string, format: date }
        bdiCode: { type: string }
        marketType: { type: integer }
        marketTypeDescription: { type: string, example: spot }
        shortName: { type: string }
        specification: { type: string, example: PN }
        term: { type: string }
        currency: { type: string, enum: [BRL] }
        openPrice: { $ref: '#/components/schemas/Money' }
        highPrice: { $ref: '#/components/schemas/Money' }
        lowPrice: { $ref: '#/components/schemas/Money' }
        averagePrice: { $ref: '#/components/schemas/Money' }
        closePrice: { $ref: '#/components/schemas/Money' }
        previousClose: { $ref: '#/components/schemas/Money' }
        absoluteChange: { $ref: '#/components/schemas/Money' }
        percentageChange: { type: [number, 'null'], format: double }
        intradayRange: { $ref: '#/components/schemas/Money' }
        bestBidPrice: { $ref: '#/components/schemas/Money' }
        bestAskPrice: { $ref: '#/components/schemas/Money' }
        bidAskSpread: { $ref: '#/components/schemas/Money' }
        tradeCount: { type: integer }
        tradedQuantity: { type: integer, format: int64 }
        tradedVolume: { $ref: '#/components/schemas/Money' }
        quoteFactor: { type: integer }
        isin: { type: string }
        distributionNumber: { type: integer }
    Money:
      type: string
      pattern: '^-?[0-9]+\.[0-9]{2}$'
      examples: ['48.20']
      description: Valor monetário decimal exato com duas casas, serializado como string.
    Metadata:
      type: object
      properties:
        ticker: { type: string }
        marketType: { type: integer }
        from: { type: string, format: date }
        to: { type: string, format: date }
        records: { type: integer }
        totalRecords: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }
        hasMore: { type: boolean }
        order: { type: string, enum: [asc, desc] }
        source: { type: string, const: B3 COTAHIST }
        sourceUrl: { type: string, format: uri }
        parserVersion: { type: string }
        layoutVersion: { type: string }
        publishedAt: { type: string, format: date-time }
        priceAdjustment: { type: string, const: unadjusted }
    QuoteEnvelope:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Quote' }
        meta: { $ref: '#/components/schemas/Metadata' }
    QuoteHistoryEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Quote' }
        meta: { $ref: '#/components/schemas/Metadata' }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            field: { type: string }
            value: { type: string }
            expectedFormat: { type: string }
            retryable: { type: boolean }
  responses:
    ComparisonSuccess:
      description: Comparação calculada; pode conter ativos ou benchmark com dados insuficientes.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ComparisonEnvelope' }
    InsufficientComparisonData:
      description: Menos de dois ativos com dados suficientes (insufficient_comparison_data).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: Erro interno sem exposição de detalhes do banco (internal_error).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RequestTimeout:
      description: Tempo limite da consulta excedido (request_timeout).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Parâmetro inválido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Cotação não encontrada
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
