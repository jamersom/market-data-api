name: Publish development image

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - develop

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish development image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: image
        shell: bash
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          short_sha="${COMMIT_SHA:0:7}"
          echo "version=dev-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "immutable=ghcr.io/jamersom/market-data-api:sha-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "development=ghcr.io/jamersom/market-data-api:dev" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
          tags: |
            ${{ steps.image.outputs.immutable }}
            ${{ steps.image.outputs.development }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
