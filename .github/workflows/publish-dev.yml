name: Publish development image

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate application
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and publish development image
    needs:
      - validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: image
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          short_sha="${COMMIT_SHA:0:7}"
          echo "version=dev-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "immutable=ghcr.io/jamersom/market-data-api:sha-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "development=ghcr.io/jamersom/market-data-api:dev" >> "$GITHUB_OUTPUT"

      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
          tags: |
            ${{ steps.image.outputs.immutable }}
            ${{ steps.image.outputs.development }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate the exact candidate before publishing
        env:
          CANDIDATE_IMAGE: ${{ steps.image.outputs.immutable }}
        run: bash .github/scripts/smoke-image.sh "$CANDIDATE_IMAGE"

      - name: Push the tested image without rebuilding
        env:
          CANDIDATE_IMAGE: ${{ steps.image.outputs.immutable }}
          DEVELOPMENT_IMAGE: ${{ steps.image.outputs.development }}
        run: |
          docker push "$CANDIDATE_IMAGE"
          docker push "$DEVELOPMENT_IMAGE"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$CANDIDATE_IMAGE")
          digest="${reference##*@}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'Validated image: `%s`\n\nIMAGE_DIGEST: `%s`\n' "$reference" "$digest" >> "$GITHUB_STEP_SUMMARY"
