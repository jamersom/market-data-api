name: CI

on:
  workflow_call:
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Test, vet and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Validate smoke script syntax and regression cases
        run: |
          bash -n .github/scripts/smoke-image.sh
          bash -n .github/scripts/smoke-image-test.sh
          bash .github/scripts/smoke-image-test.sh

      - name: Validate Stack configuration and required digest
        env:
          POSTGRES_USER: validation
          POSTGRES_PASSWORD: validation-only
          POSTGRES_DB: validation
        run: |
          export IMAGE_DIGEST="sha256:$(printf '%064d' 0)"
          docker stack config --compose-file docker-stack.yml > /dev/null
          if IMAGE_DIGEST= docker stack config --compose-file docker-stack.yml > /dev/null 2>&1; then
            echo 'Stack must reject an empty IMAGE_DIGEST' >&2
            exit 1
          fi
          if env -u IMAGE_DIGEST docker stack config --compose-file docker-stack.yml > /dev/null 2>&1; then
            echo 'Stack must require IMAGE_DIGEST' >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: market-data-api:ci
          platforms: linux/amd64
          build-args: |
            VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate operational endpoints in the image
        run: bash .github/scripts/smoke-image.sh market-data-api:ci
